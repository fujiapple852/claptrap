[licenses]
version = 2
allow = ["Apache-2.0", "MIT", "Unicode-3.0", "BSD-2-Clause", "BSD-3-Clause"]

confidence-threshold = 0.8
exceptions = []

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = [
  # serde_yaml currently depends on unsafe-libyaml; allow this advisory until the
  # YAML dependency can be replaced.
  # https://rustsec.org/advisories/RUSTSEC-2024-0449
  "RUSTSEC-2024-0449",
]
